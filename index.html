<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅程">
<title>旅程プランナー</title>
<style>
/* ============================================================
   Design tokens — Paper / Ink  （light は暖かみのある紙、dark は炭）
   ============================================================ */
:root{
  --bg:#FBFAF8; --bg-2:#F5F3EE;
  --surface:#FFFFFF; --surface-2:#F4F2ED; --surface-3:#EDEAE3;
  --line:rgba(28,25,20,.09); --line-2:rgba(28,25,20,.16);
  --ink:#1B1815; --ink-2:#6B6459; --ink-3:#9A9287;
  --accent:#2A5BD7; --accent-soft:rgba(42,91,215,.10);
  --danger:#C0392B; --danger-soft:rgba(192,57,43,.10);
  --btn:#1B1815; --btn-ink:#FBFAF8;
  --tint:.11; --tint-hover:.16; --ink-mix:.60;
  --shadow-1:0 1px 2px rgba(28,25,20,.05);
  --shadow-2:0 2px 6px rgba(28,25,20,.07), 0 12px 32px -16px rgba(28,25,20,.25);
  --shadow-3:0 12px 40px -12px rgba(28,25,20,.38);
  --grid:rgba(28,25,20,.07); --grid-half:rgba(28,25,20,.035);
  --hour-h:60px; --gutter:54px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-theme="dark"]{
  --bg:#121110; --bg-2:#191817;
  --surface:#1C1B19; --surface-2:#242220; --surface-3:#2C2A27;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.17);
  --ink:#F2EEE7; --ink-2:#A9A197; --ink-3:#7C756B;
  --accent:#8FB0FF; --accent-soft:rgba(143,176,255,.14);
  --danger:#F0857A; --danger-soft:rgba(240,133,122,.14);
  --btn:#F2EEE7; --btn-ink:#151413;
  --tint:.20; --tint-hover:.28; --ink-mix:.55;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 8px rgba(0,0,0,.45);
  --shadow-3:0 16px 44px -12px rgba(0,0,0,.7);
  --grid:rgba(255,255,255,.08); --grid-half:rgba(255,255,255,.035);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 0;
  transition:background .25s ease, color .25s ease;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100%;max-width:780px;margin:0 auto;position:relative}

/* ---------------- header ---------------- */
header{
  background:var(--bg); flex:0 0 auto; z-index:20;
  padding-top:env(safe-area-inset-top,0px);
  border-bottom:1px solid var(--line);
}
.hrow{display:flex;align-items:flex-start;gap:6px;padding:12px 14px 6px}
.title{flex:1;min-width:0}
.overline{
  font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.title h1{
  margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.iconbtn{
  width:36px;height:36px;flex:0 0 auto;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--ink-2);background:transparent;position:relative;transition:background .15s
}
.iconbtn:active{background:var(--surface-2)}
.iconbtn .dot{position:absolute;right:6px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.dot.on{background:#2E9E63}
.dot.wait{background:#D99A20}
.dot.err{background:var(--danger)}

.daymeta{
  display:flex;align-items:center;gap:7px;padding:0 16px 8px;
  font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.daymeta b{color:var(--ink);font-weight:600}
.daymeta i{width:3px;height:3px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}

.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 10px 9px;scrollbar-width:none;scroll-behavior:smooth}
.tabs::-webkit-scrollbar{display:none}
.citymark{
  flex:0 0 auto;display:flex;align-items:center;padding:0 6px 0 9px;margin:6px 2px 6px 6px;
  font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--ink-3);
  border-left:1px solid var(--line-2);text-transform:uppercase
}
.tabs .citymark:first-child{border-left:0;margin-left:2px;padding-left:2px}
.tab{
  flex:0 0 auto;width:50px;padding:6px 0 7px;border-radius:14px;text-align:center;line-height:1.15;
  background:transparent;color:var(--ink-2);transition:background .18s, color .18s
}
.tab .wd{display:block;font-size:9.5px;font-weight:700;letter-spacing:.06em;opacity:.75}
.tab .dt{display:block;font-size:17px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tab .pip{display:block;width:4px;height:4px;border-radius:50%;background:var(--ink-3);margin:3px auto 0;opacity:.45}
.tab.active{background:var(--btn);color:var(--btn-ink)}
.tab.active .pip{background:var(--btn-ink);opacity:.6}
.tab.today .dt{color:var(--danger)}
.tab.active.today .dt{color:var(--btn-ink)}

.bar{display:flex;align-items:center;gap:6px;padding:0 12px 9px;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.act{
  flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;
  background:var(--btn);color:var(--btn-ink);font-size:11.5px;font-weight:650;letter-spacing:.01em;
  box-shadow:var(--shadow-1)
}
.act.sec{background:transparent;color:var(--ink-2);border:1px solid var(--line-2);box-shadow:none}
.act:active{opacity:.75}
.vdiv{flex:0 0 auto;width:1px;height:16px;background:var(--line-2);margin:0 4px}
.chip{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 11px 6px 9px;border-radius:999px;
  border:1px solid var(--line);font-size:11px;color:var(--ink-2);background:transparent;transition:opacity .15s
}
.chip .sw{width:8px;height:8px;border-radius:3px}
.chip.off{opacity:.3}
.seg{flex:0 0 auto;display:flex;background:var(--surface-2);border-radius:999px;padding:2px;margin-left:auto}
.seg button{padding:5px 12px;border-radius:999px;font-size:11px;color:var(--ink-3);font-weight:600}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}

/* ---------------- timeline ---------------- */
.scroller{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.grid{display:flex;position:relative;padding:10px 0 calc(120px + var(--safe-b))}
.gutter{flex:0 0 var(--gutter);position:relative}
.gutter .hlabel{
  position:absolute;right:9px;font-size:10px;font-weight:600;color:var(--ink-3);
  transform:translateY(-6px);font-variant-numeric:tabular-nums;letter-spacing:.02em
}
.lanes{flex:1 1 auto;position:relative}
.hline{position:absolute;left:0;right:12px;height:0;border-top:1px solid var(--grid)}
.hline.half{border-top:1px solid var(--grid-half)}
.nowline{position:absolute;left:-6px;right:12px;height:0;border-top:1.5px solid var(--danger);z-index:6;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-2px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.evlayer{position:absolute;inset:0}
.ev{
  position:absolute;border-radius:11px;padding:5px 9px 5px 11px;overflow:hidden;
  font-size:12px;line-height:1.3;
  border-left:3px solid var(--c);
  transition:box-shadow .14s ease, transform .14s ease, opacity .14s ease;
}
.ev .t{font-weight:650;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.ev .m{display:block;font-size:10.5px;opacity:.78;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;font-variant-numeric:tabular-nums}
.ev .lk{position:absolute;top:3px;right:3px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;opacity:.7}
.ev .hd{position:absolute;left:0;right:0;bottom:0;height:13px}
.ev .hd::after{content:"";position:absolute;left:50%;bottom:3px;width:24px;height:3px;border-radius:2px;background:currentColor;opacity:.28;transform:translateX(-50%)}
.ev.small{padding:2px 8px 2px 10px}
.ev.small .t{font-size:11px}
.ev.dragging{z-index:30;box-shadow:var(--shadow-3);transform:scale(1.015)}
.evlayer.dragmode .ev:not(.dragging){opacity:.35}
.badge{
  position:fixed;z-index:60;background:var(--btn);color:var(--btn-ink);border-radius:10px;padding:6px 11px;
  font-size:12px;font-weight:700;pointer-events:none;display:none;box-shadow:var(--shadow-3);font-variant-numeric:tabular-nums
}

/* ---------------- list ---------------- */
.list{padding:12px 14px calc(120px + var(--safe-b));display:none}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;
  position:relative;box-shadow:var(--shadow-1);overflow:hidden
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.card .top{display:flex;align-items:baseline;gap:9px}
.card .time{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:0 0 auto;font-weight:600}
.card .name{font-weight:680;font-size:15.5px;flex:1;min-width:0;letter-spacing:-.015em}
.card .meta{margin-top:7px;font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.card .meta a{color:var(--accent);text-decoration:none;word-break:break-all}
.stars{color:#D99A20;letter-spacing:1.5px;font-size:11.5px}
.catpill{font-size:10px;padding:3px 9px;border-radius:999px;font-weight:700;letter-spacing:.02em}

/* ---------------- fab ---------------- */
.fab{
  position:absolute;right:18px;bottom:calc(20px + var(--safe-b));height:52px;padding:0 20px;border-radius:16px;
  background:var(--btn);color:var(--btn-ink);font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;
  box-shadow:var(--shadow-2);z-index:25;letter-spacing:.01em
}
.fab span{font-size:19px;font-weight:400;line-height:1}
.fab:active{transform:scale(.96)}

/* ---------------- sheets ---------------- */
.mask{position:fixed;inset:0;background:rgba(20,18,15,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;max-width:780px;margin:0 auto;background:var(--surface);
  border-radius:26px 26px 0 0;z-index:50;transform:translateY(101%);
  transition:transform .3s cubic-bezier(.22,1,.36,1);max-height:93vh;display:flex;flex-direction:column;
  box-shadow:var(--shadow-3);border-top:1px solid var(--line)
}
.sheet.on{transform:translateY(0)}
.sheet .handle{width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:10px auto 2px;flex:0 0 auto}
.sheet .body{overflow-y:auto;padding:8px 18px calc(24px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sheet h2{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 12px}
.sheet h2:first-child{margin-top:8px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:11px 12px;outline:none;
  transition:border-color .15s, box-shadow .15s
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:70px;resize:vertical}
.row2{display:flex;gap:9px}
.row2>*{flex:1;min-width:0}
.cats{display:flex;flex-wrap:wrap;gap:7px}
.cats button{padding:8px 13px;border-radius:999px;background:var(--surface-2);font-size:12px;font-weight:600;border:1px solid transparent;transition:.15s}
.starpick{display:flex;gap:5px;font-size:27px;color:var(--line-2)}
.starpick span.on{color:#D99A20}
.btns{display:flex;gap:9px;margin-top:8px}
.btn{flex:1;padding:14px;border-radius:14px;background:var(--surface-2);text-align:center;font-weight:650;font-size:13.5px;transition:.15s}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--btn);color:var(--btn-ink);box-shadow:var(--shadow-1)}
.btn.dan{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:10px;font-size:12px}
.det .dtitle{font-size:22px;font-weight:700;margin:4px 0 4px;letter-spacing:-.025em;line-height:1.25}
.det .drow{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px}
.det .drow .k{flex:0 0 80px;color:var(--ink-3);font-size:11.5px;font-weight:600;padding-top:1px}
.det .drow .v{flex:1;min-width:0;word-break:break-word}
.det .drow .v a{color:var(--accent);text-decoration:none;word-break:break-all}
.mini{font-size:11.5px;color:var(--ink-3);margin:-2px 0 12px}
.trashitem{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.trashitem .ti{flex:1;min-width:0}
.trashitem .ti b{display:block;font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trashitem .ti span{font-size:11px;color:var(--ink-3)}
.catedit{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.catedit input[type=color]{width:32px;height:32px;padding:0;border:0;background:none;flex:0 0 auto;border-radius:8px}
.catedit input[type=text]{flex:1;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px}
.toast{
  position:fixed;left:50%;bottom:calc(26px + var(--safe-b));transform:translateX(-50%) translateY(16px);
  background:var(--btn);color:var(--btn-ink);padding:12px 16px;border-radius:14px;font-size:13px;
  display:flex;align-items:center;gap:16px;z-index:70;opacity:0;pointer-events:none;transition:.22s cubic-bezier(.22,1,.36,1);
  box-shadow:var(--shadow-3);max-width:92vw
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{color:var(--accent);font-weight:700;flex:0 0 auto}
html[data-theme="light"] .toast button{color:#8FB0FF}
.hint{font-size:11.5px;color:var(--ink-2);line-height:1.7;background:var(--surface-2);border-radius:12px;padding:11px 13px;margin-bottom:13px}
.empty{text-align:center;color:var(--ink-3);font-size:13px;padding:44px 20px}
.empty .big{font-size:15px;color:var(--ink-2);font-weight:600;margin-bottom:6px}

/* 3-way toggle */
.tri{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.tri button{flex:1;padding:9px;border-radius:10px;font-size:12px;font-weight:600;color:var(--ink-2)}
.tri button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}

/* search */
.sresult{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.sresult .sd{flex:0 0 52px;font-size:11px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:2px}
.sresult .sb{flex:1;min-width:0}
.sresult .sb b{display:block;font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sresult .sb span{display:block;font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sresult .sc{flex:0 0 auto;width:8px;height:8px;border-radius:3px;margin-top:5px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hrow">
      <div class="title">
        <div class="overline" id="tripDates"></div>
        <h1 id="tripName">旅行</h1>
      </div>
      <button class="iconbtn" id="btnSearch" aria-label="検索"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
      <button class="iconbtn" id="btnTheme" aria-label="表示テーマ"></button>
      <button class="iconbtn" id="btnMenu" aria-label="メニュー"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h11"/></svg><span class="dot" id="syncDot"></span></button>
    </div>
    <div class="daymeta" id="dayMeta"></div>
    <div class="tabs" id="tabs"></div>
    <div class="bar" id="legend"></div>
  </header>

  <div class="scroller" id="scroller">
    <div class="grid" id="grid">
      <div class="gutter" id="gutter"></div>
      <div class="lanes" id="lanes">
        <div class="evlayer" id="evlayer"></div>
      </div>
    </div>
    <div class="list" id="listView"></div>
  </div>

  <button class="fab" id="fab" aria-label="予定を追加"><span>＋</span>予定</button>
</div>

<div class="badge" id="badge"></div>
<div class="mask" id="mask"></div>

<!-- 詳細 -->
<div class="sheet" id="sheetDetail"><div class="handle"></div><div class="body det" id="detailBody"></div></div>
<!-- 編集 -->
<div class="sheet" id="sheetEdit"><div class="handle"></div><div class="body" id="editBody"></div></div>
<!-- 設定 -->
<div class="sheet" id="sheetMenu"><div class="handle"></div><div class="body" id="menuBody"></div></div>
<!-- 検索 -->
<div class="sheet" id="sheetSearch"><div class="handle"></div><div class="body" id="searchBody"></div></div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn" style="display:none"></button></div>

<script>
/* ============================================================
   旅程プランナー  ―  single file / GitHub Pages ready
   Firebase Realtime Database（任意）＋ localStorage フォールバック
   ============================================================ */

/* ---- ① ここに Firebase の設定を貼り付けてください（未設定でも動きます） ---- */
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyAfDuI3P9oHimO_6Jv80Ug3SSrGTF1eM1I",
  authDomain:        "trip-987a0.firebaseapp.com",
  databaseURL:       "https://trip-987a0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "trip-987a0",
  storageBucket:     "trip-987a0.firebasestorage.app",
  messagingSenderId: "80217001522",
  appId:             "1:80217001522:web:b6d9ffaa0eec357ce0362b"
};
/* 家族で共有する部屋名。URL に #room=xxxx を付けると切り替わります */
let ROOM_ID = (location.hash.match(/room=([A-Za-z0-9_-]+)/) || [,"kazoku-7m4qx2"])[1];

/* ------------------------- 定数 ------------------------- */
const DAY_START = 6 * 60;      // 標準の表示開始 6:00
const DAY_END   = 27 * 60;     // 標準の表示終了 翌3:00（深夜の予定も置けるように）
const RANGE_MIN = 4 * 60;      // 早朝便などで自動的に広がる下限 4:00
let GS = DAY_START, GE = DAY_END;   // その日の実際の表示範囲（予定に合わせて自動で広がる）
const PX_PER_MIN = 1;          // 1分 = 1px（1時間 = 60px）
const SNAP = 30;               // ドラッグは30分刻み
const LS_KEY = "tripPlanner-v3:" + ROOM_ID;

const DEFAULT_CATEGORIES = {
  sight:  { label:"観光",       color:"#2563EB" },
  food:   { label:"食事",       color:"#E0670B" },
  shop:   { label:"ショッピング", color:"#D3306E" },
  move:   { label:"移動",       color:"#6B7280" },
  stay:   { label:"宿泊",       color:"#7C4DDB" },
  night:  { label:"ナイトライフ", color:"#3B3AA8" },
  sports: { label:"スポーツ",    color:"#0E8A6E" },
  other:  { label:"その他",      color:"#8A6D3B" }
};
/* 旧パレット → 新パレット（ユーザーが色を変えていない項目だけ移行する） */

let themePref = (()=>{ try{ return localStorage.getItem("tripTheme")||"auto"; }catch(e){ return "auto"; } })();
const mqDark = window.matchMedia("(prefers-color-scheme: dark)");
function isDark(){ return themePref==="dark" || (themePref==="auto" && mqDark.matches); }
function applyTheme(){

  const mt=document.querySelector('meta[name="theme-color"]');

    ? '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.5 1.5M17.1 17.1l1.5 1.5M18.6 5.4l-1.5 1.5M6.9 17.1l-1.5 1.5"/></svg>'
    : '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.4A8.4 8.4 0 1 1 9.6 4a6.6 6.6 0 0 0 10.4 10.4z"/></svg>';
  const sb=document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if(sb) sb.setAttribute("content", dark?"black-translucent":"default");
  if(typeof state!=="undefined" && state) render();
}
function setTheme(v){ themePref=v; try{ localStorage.setItem("tripTheme",v); }catch(e){} applyTheme(); }
mqDark.addEventListener("change", ()=>{ if(themePref==="auto") applyTheme(); });

/* 色ユーティリティ（ティント表現） */
function hex2rgb(h){
  h=String(h||"#888888").replace("#","");
  if(h.length===3) h=h.split("").map(c=>c+c).join("");
  const n=parseInt(h,16)||0;
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function tintOf(hex,a){ const[r,g,b]=hex2rgb(hex); return "rgba("+r+","+g+","+b+","+a+")"; }
function inkOf(hex){
  const[r,g,b]=hex2rgb(hex);
  if(isDark()){ const m=.52; return "rgb("+Math.round(r+(255-r)*m)+","+Math.round(g+(255-g)*m)+","+Math.round(b+(255-b)*m)+")"; }
  return "rgb("+Math.round(r*.56)+","+Math.round(g*.56)+","+Math.round(b*.56)+")";
}
function blockTint(){ return isDark()?.20:.11; }

/* ------------------------- ユーティリティ ------------------------- */
const $ = (s)=>document.querySelector(s);
const pad = (n)=>String(n).padStart(2,"0");
const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = (s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function fmtTime(min){
  let h = Math.floor(min/60), m = min%60;
  if(h>=24) return "翌"+(h-24)+":"+pad(m);
  return h+":"+pad(m);
}
function fmtTimeFlat(min){ // ics / gcal 用（24h以降は翌日に繰り上げ）
  return { dayOffset: Math.floor(min/1440), h: Math.floor(min/60)%24, m: min%60 };
}
function parseDate(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function toKey(dt){ return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate()); }
function addDays(s,n){ const d=parseDate(s); d.setDate(d.getDate()+n); return toKey(d); }
const WD = ["日","月","火","水","木","金","土"];
function dayLabel(s){ const d=parseDate(s); return (d.getMonth()+1)+"/"+d.getDate(); }
function wdLabel(s){ return WD[parseDate(s).getDay()]; }

function tripDays(){
  const out=[]; let c=state.meta.start;
  const end=state.meta.end;
  let guard=0;
  while(guard++<400){ out.push(c); if(c===end) break; if(parseDate(c)>parseDate(end)) break; c=addDays(c,1); }
  return out.length?out:[state.meta.start];
}
/* 都市（区間）とタイムゾーン ------------------------------------ */
function segments(){
  const s = (state.meta.segments||[]).slice().sort((a,b)=>a.from.localeCompare(b.from));
  return s.length ? s : [{from:state.meta.start, code:"", label:"", tz:state.meta.tz||"Asia/Tokyo"}];
}
function segOf(date){
  const s=segments();
  let cur=s[0];
  for(const x of s){ if(x.from<=date) cur=x; }
  return cur;
}
function tzOf(date){ return (segOf(date)||{}).tz || state.meta.tz || "Asia/Tokyo"; }

function catOf(id){ return state.categories[id] || state.categories.other || {label:"その他",color:"#4bb37b"}; }
function eventsOfDay(d){
  return Object.values(state.events).filter(e=>e.date===d).sort((a,b)=>a.start-b.start||a.end-b.end);
}
function durLabel(min){
  const h=Math.floor(min/60), m=min%60;
  if(h===0) return m+"分";
  return h+"時間"+(m?m+"分":"");
}
function stars(n){ n=Number(n)||0; return "★".repeat(n)+"☆".repeat(Math.max(0,5-n)); }

/* ------------------------- 保存 / 同期 ------------------------- */
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

let syncText="ローカル保存";
function setSync(cls, txt){ syncText=txt; const d=$("#syncDot"); if(d) d.className="dot "+cls; }

function pushAll(){
  saveLocal();
  if(!fbRef) return;
  applyingRemote = true;
  fbRef.set(JSON.parse(JSON.stringify(state)))
    .then(()=>{ setSync("on","同期中"); })
    .catch(err=>{ setSync("err","同期エラー"); console.warn(err); })
    .finally(()=>{ setTimeout(()=>applyingRemote=false, 60); });
}
function commit(){ pushAll(); render(); }

async function initFirebase(){
  if(!FIREBASE_CONFIG.databaseURL){ setSync("", "ローカル保存"); return; }
  setSync("wait","接続中…");
  try{
    const appMod = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
    const dbMod  = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js");
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    db = dbMod.getDatabase(app);
    const r = dbMod.ref(db, "trips/"+ROOM_ID);
    fbRef = { set:(v)=>dbMod.set(r,v) };
    dbMod.onValue(r, (snap)=>{
      const v = snap.val();
      if(!v){ pushAll(); setSync("on","同期中"); return; }
      if(applyingRemote) { setSync("on","同期中"); return; }
      if(dragging) return;
      state = normalize(v);
      saveLocal();
      setSync("on","同期中");
      render();
    }, (err)=>{ setSync("err","同期エラー"); console.warn(err); });
  }catch(e){
    console.warn(e); setSync("err","接続失敗（ローカル保存）");
  }
}

function normalize(v){
  v = v || {};
  v.meta = Object.assign({name:"旅行",start:toKey(new Date()),end:toKey(new Date()),tz:"Asia/Tokyo",note:""}, v.meta||{});
  if(!Array.isArray(v.meta.segments) || !v.meta.segments.length){
    v.meta.segments = [{ from:v.meta.start, code:"", label:"", tz:v.meta.tz||"Asia/Tokyo" }];
  }
  v.categories = Object.assign({}, DEFAULT_CATEGORIES, v.categories||{});
  Object.keys(DEFAULT_CATEGORIES).forEach(k=>{
    const cur=(v.categories[k]&&v.categories[k].color||"").toLowerCase();
    if(cur===LEGACY_COLORS[k] || cur===LEGACY_COLORS._v1[k]) v.categories[k].color=DEFAULT_CATEGORIES[k].color;
  });
  v.events = v.events || {};
  v.trash  = v.trash  || {};
  Object.values(v.events).forEach(e=>{ e.rating = Number(e.rating)||0; e.start=Number(e.start); e.end=Number(e.end); });
  return v;
}

/* ------------------------- 描画 ------------------------- */
function render(){
  if(!state) return;
  $("#tripName").textContent = state.meta.name || "旅行";
  const ds = tripDays();
  if(dayIndex >= ds.length) dayIndex = ds.length-1;
  if(dayIndex < 0) dayIndex = 0;
  const sgNow = segOf(ds[dayIndex]);
  const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const ps=parseDate(state.meta.start), pe=parseDate(state.meta.end);
  $("#tripDates").textContent =
    MON[ps.getMonth()]+" "+ps.getDate()+" – "+(ps.getMonth()!==pe.getMonth()?MON[pe.getMonth()]+" ":"")+pe.getDate()+", "+pe.getFullYear();
  /* 今日の情報 */
  const today=ds[dayIndex], evs=eventsOfDay(today);
  const span = evs.length ? fmtTime(evs[0].start)+"–"+fmtTime(Math.max.apply(null,evs.map(x=>x.end))) : "予定なし";
  $("#dayMeta").innerHTML =
    (sgNow&&sgNow.label ? "<b>"+esc(sgNow.label)+"</b><i></i>" : "")
    + dayLabel(today)+"("+wdLabel(today)+")<i></i>"
    + evs.length+"件<i></i><span class=num>"+span+"</span>";
  renderTabs(ds); renderLegend(); computeRange(); renderGrid();
  if(viewMode==="timeline"){ $("#grid").style.display="flex"; $("#listView").style.display="none"; renderEvents(); }
  else { $("#grid").style.display="none"; $("#listView").style.display="block"; renderList(); }
}

function renderTabs(ds){
  const w = $("#tabs"); w.innerHTML="";
  const today=toKey(new Date());
  let lastCode=null, activeEl=null;
  ds.forEach((d,i)=>{
    const sg=segOf(d);
    const code=(sg&&sg.code)||"";
    if(code && code!==lastCode){
      const m=document.createElement("button");
      m.className="citymark"; m.textContent=code;
      m.onclick=()=>{ dayIndex=i; render(); };
      w.appendChild(m); lastCode=code;
    }
    const b=document.createElement("button");
    b.className="tab"+(i===dayIndex?" active":"")+(d===today?" today":"");
    const n=eventsOfDay(d).length;
    b.innerHTML = '<span class="wd">'+wdLabel(d)+'</span><span class="dt">'+parseDate(d).getDate()+'</span>'
                + (n?'<span class="pip"></span>':'<span class="pip" style="opacity:0"></span>');
    b.onclick = ()=>{ dayIndex=i; render(); b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"}); };
    w.appendChild(b);
    if(i===dayIndex) activeEl=b;
  });
  if(activeEl) activeEl.scrollIntoView({inline:"center",block:"nearest"});
}

  w.appendChild(bCopy);

  Object.entries(state.categories).forEach(([k,c])=>{
    const b=document.createElement("button");
    b.className="chip"+(hiddenCats.has(k)?" off":"");
    b.innerHTML = '<i class="sw" style="background:'+c.color+'"></i>'+esc(c.label);
    b.onclick=()=>{ hiddenCats.has(k)?hiddenCats.delete(k):hiddenCats.add(k); render(); };
    w.appendChild(b);
  });

  seg.innerHTML='<button data-v="timeline">タイムライン</button><button data-v="list">リスト</button>';

    if(b.dataset.v===viewMode) b.classList.add("on");
    b.onclick=()=>{ viewMode=b.dataset.v; render(); };
  });
  w.appendChild(seg);
}

function computeRange(){
  const list=eventsOfDay(tripDays()[dayIndex]);
  let s=DAY_START, e=DAY_END;
  list.forEach(x=>{ s=Math.min(s, Math.floor(x.start/60)*60); e=Math.max(e, Math.ceil(x.end/60)*60); });
  GS=Math.max(0,s); GE=e;
}
function renderGrid(){
  const g=$("#gutter"), l=$("#lanes");
  const h = (GE-GS)*PX_PER_MIN;
  g.style.height = h+"px"; l.style.height = h+"px";
  const key=GS+"-"+GE;
  if(g.dataset.built===key) { placeNowLine(); return; }
  l.querySelectorAll(".hline,.nowline").forEach(x=>x.remove());
  let gh="", lh="";
  for(let m=GS; m<=GE; m+=30){
    const top=(m-GS)*PX_PER_MIN;
    if(m%60===0){
      gh += '<div class="hlabel" style="top:'+top+'px">'+fmtTime(m)+'</div>';
      lh += '<div class="hline" style="top:'+top+'px"></div>';
    } else {
      lh += '<div class="hline half" style="top:'+top+'px"></div>';
    }
  }
  g.innerHTML=gh; g.dataset.built=key;
  l.insertAdjacentHTML("afterbegin", lh);
  l.insertAdjacentHTML("beforeend", '<div class="nowline" id="nowline" style="display:none"></div>');
  placeNowLine();
}
function placeNowLine(){
  const nl=$("#nowline"); if(!nl) return;
  const now=new Date(), key=toKey(now), ds=tripDays();
  const min=now.getHours()*60+now.getMinutes();
  if(ds[dayIndex]!==key || min<GS || min>GE){ nl.style.display="none"; return; }
  nl.style.display="block"; nl.style.top = ((min-GS)*PX_PER_MIN)+"px";
}

function layout(list){
  const groups=[]; let cur=[], curEnd=-1;
  list.forEach(e=>{
    if(cur.length && e.start >= curEnd){ groups.push(cur); cur=[]; curEnd=-1; }
    cur.push(e); curEnd=Math.max(curEnd, e.end);
  });
  if(cur.length) groups.push(cur);
  groups.forEach(g=>{
    const cols=[];
    g.forEach(e=>{
      let placed=false;
      for(let i=0;i<cols.length;i++){
        if(cols[i][cols[i].length-1].end <= e.start){ cols[i].push(e); e._col=i; placed=true; break; }
      }
      if(!placed){ cols.push([e]); e._col=cols.length-1; }
    });
    g.forEach(e=> e._cols = cols.length);
  });
}

function renderEvents(){
  const layer=$("#evlayer"); layer.innerHTML="";

    ph.className="empty";
    ph.style.cssText="position:absolute;left:0;right:0;top:120px";
    ph.innerHTML='<div class="big">この日はまだ空です</div>時間帯をタップして予定を追加';
    layer.appendChild(ph);
  }
  layout(list);
  list.forEach(e=>{
    const el=document.createElement("div");
    el.className="ev"; el.dataset.id=e.id;
    styleEvent(el,e);
    const dur=e.end-e.start;
    const c=catOf(e.cat);
    let meta = fmtTime(e.start)+"–"+fmtTime(e.end);
    if(e.rating) meta += " ・ "+"★".repeat(e.rating);
    if(e.place) meta += " ・ "+e.place;
    el.innerHTML =
      '<span class="t">'+esc(e.title||"(無題)")+'</span>' +
      (dur>=45 ? '<span class="m">'+esc(meta)+'</span>' : '') +
      (e.url ? '<button class="lk" data-lk="1">↗</button>' : '') +
      (dur>=40 ? '<div class="hd" data-hd="1"></div>' : '');
    if(dur<45) el.classList.add("small");
    layer.appendChild(el);
    attachEventGestures(el, e);
  });

}
function styleEvent(el,e){
  const c=catOf(e.cat);
  const top=(e.start-GS)*PX_PER_MIN;
  const h=Math.max(22,(e.end-e.start)*PX_PER_MIN-3);
  const cols=e._cols||1, col=e._col||0;
  const wpc=100/cols;
  el.style.top=top+"px"; el.style.height=h+"px";
  el.style.left="calc("+(wpc*col)+"% + 4px)";
  el.style.width="calc("+wpc+"% - 16px)";
  el.style.setProperty("--c", c.color);
  el.style.background=tintOf(c.color, blockTint());
  el.style.color=inkOf(c.color);
}

/* ------------------------- タッチ操作（長押しドラッグ / リサイズ） ------------------------- */
let lastTouch=0;
document.addEventListener("touchstart",()=>{ lastTouch=Date.now(); },{passive:true,capture:true});

function attachEventGestures(el, e){
  let t0=0, y0=0, x0=0, mode=null, timer=null, startMin=0, endMin=0, moved=false, scrollTop0=0;
  const badge=$("#badge");

  const clear=()=>{ clearTimeout(timer); timer=null; };
  const finish=()=>{
    clear();
    if(mode){
      el.classList.remove("dragging","picked");
      $("#evlayer").classList.remove("dragmode");
      badge.style.display="none";
      const ev = state.events[e.id];
      if(ev && (ev.start!==startMin || ev.end!==endMin)){ ev.updatedAt=Date.now(); }
      dragging=false;
      suppressClickUntil=Date.now()+450;
      commit();
    }
    mode=null;
  };

  el.addEventListener("touchstart",(t)=>{
    if(t.touches.length>1) return;
    t0=Date.now(); y0=t.touches[0].clientY; x0=t.touches[0].clientX; moved=false;
    startMin=e.start; endMin=e.end;
    scrollTop0=$("#scroller").scrollTop;
    if(t.target.closest("[data-lk]")) return;   // リンクボタンはタップのみ
    if(t.target.closest("[data-hd]")){
      // 下端 → 即リサイズ
      t.preventDefault();
      mode="resize"; dragging=true; el.classList.add("dragging"); $("#evlayer").classList.add("dragmode");
      showBadge(t.touches[0]); return;
    }
    timer=setTimeout(()=>{
      mode="move"; dragging=true; el.classList.add("dragging","picked"); $("#evlayer").classList.add("dragmode");
      if(navigator.vibrate) navigator.vibrate(12);
      showBadge({clientX:x0, clientY:y0});
    },420);
  },{passive:false});

  function applyMove(tx,ty){
    const scrollDelta = $("#scroller").scrollTop - scrollTop0;
    const dy = (ty - y0 + scrollDelta)/PX_PER_MIN;
    const ev = state.events[e.id]; if(!ev) return;
    if(mode==="move"){
      let ns = startMin + Math.round(dy/SNAP)*SNAP;
      const dur = endMin-startMin;
      ns = Math.max(GS, Math.min(GE-dur, ns));
      ev.start=ns; ev.end=ns+dur;
    } else {
      let ne = endMin + Math.round(dy/SNAP)*SNAP;
      ne = Math.max(ev.start+SNAP, Math.min(GE, ne));
      ev.end=ne;
    }
    e.start=ev.start; e.end=ev.end;
    styleEvent(el,e);
    const m=el.querySelector(".m");
    if(m) m.textContent = fmtTime(ev.start)+"–"+fmtTime(ev.end)+(ev.place?" ・ "+ev.place:"");
    badge.textContent = fmtTime(ev.start)+" – "+fmtTime(ev.end);
    badge.style.left = Math.min(window.innerWidth-120, Math.max(8, tx-56))+"px";
    badge.style.top  = Math.max(8, ty-52)+"px";
    autoScroll(ty);
  }

  el.addEventListener("touchmove",(t)=>{
    const ty=t.touches[0].clientY, tx=t.touches[0].clientX;
    if(!mode){
      if(Math.abs(ty-y0)>8 || Math.abs(tx-x0)>8){ moved=true; clear(); }
      return;
    }
    t.preventDefault();
    applyMove(tx,ty);
  },{passive:false});

  el.addEventListener("touchend",(t)=>{
    const quick = Date.now()-t0 < 420 && !moved && !mode;
    finish();
    if(quick){
      const lk = t.target.closest("[data-lk]");
      if(lk){ const u=state.events[e.id].url; if(u) window.open(u,"_blank","noopener"); return; }
      openDetail(state.events[e.id]);
    }
  });
  el.addEventListener("touchcancel", finish);

  /* デスクトップ用（マウス）：長押し(0.3秒)ドラッグで移動、下端ドラッグで長さ変更 */
  el.addEventListener("mousedown",(ev)=>{
    if(ev.button!==0) return;
    if(Date.now()-lastTouch < 1200) return;          // タッチ端末のエミュレートmouseは無視
    if(ev.target.closest("[data-lk]")) return;
    t0=Date.now(); x0=ev.clientX; y0=ev.clientY; moved=false;
    startMin=e.start; endMin=e.end; scrollTop0=$("#scroller").scrollTop;
    const onHd = !!ev.target.closest("[data-hd]");
    if(onHd){ ev.preventDefault(); mode="resize"; dragging=true; el.classList.add("dragging"); $("#evlayer").classList.add("dragmode"); showBadge(ev); }
    else timer=setTimeout(()=>{ mode="move"; dragging=true; el.classList.add("dragging","picked"); $("#evlayer").classList.add("dragmode"); showBadge({clientX:x0,clientY:y0}); },300);
    const mm=(e2)=>{
      if(!mode){ if(Math.abs(e2.clientY-y0)>6||Math.abs(e2.clientX-x0)>6){ moved=true; clear(); } return; }
      e2.preventDefault(); applyMove(e2.clientX, e2.clientY);
    };
    const mu=()=>{
      document.removeEventListener("mousemove",mm); document.removeEventListener("mouseup",mu);
      const quick = !mode && !moved;
      finish();
      if(quick) openDetail(state.events[e.id]);
    };
    document.addEventListener("mousemove",mm); document.addEventListener("mouseup",mu);
  });
  el.addEventListener("click",(ev)=>{
    const lk=ev.target.closest("[data-lk]");
    if(lk){ const u=state.events[e.id].url; if(u) window.open(u,"_blank","noopener"); }
  });

  function showBadge(pt){
    badge.style.display="block";
    badge.textContent = fmtTime(e.start)+" – "+fmtTime(e.end);
    badge.style.left = Math.min(window.innerWidth-120, Math.max(8, pt.clientX-56))+"px";
    badge.style.top  = Math.max(8, pt.clientY-52)+"px";
  }
}
let asRaf=null;
function autoScroll(clientY){
  const sc=$("#scroller"), r=sc.getBoundingClientRect();
  let d=0;
  if(clientY < r.top+70) d = -Math.min(14,(r.top+70-clientY)/4);
  else if(clientY > r.bottom-90) d = Math.min(14,(clientY-(r.bottom-90))/4);
  if(asRaf) cancelAnimationFrame(asRaf);
  if(d!==0 && dragging){ sc.scrollTop += d; asRaf=requestAnimationFrame(()=>autoScroll(clientY)); }
}

/* 横スワイプで日移動 */
(function(){
  const sc=$("#scroller"); let sx=0,sy=0,act=false;
  sc.addEventListener("touchstart",(t)=>{ if(t.touches.length>1){act=false;return;} sx=t.touches[0].clientX; sy=t.touches[0].clientY; act=true; },{passive:true});
  sc.addEventListener("touchend",(t)=>{
    if(!act||dragging) return; act=false;
    const dx=t.changedTouches[0].clientX-sx, dy=t.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6){
      const ds=tripDays();

})();

function copyText(txt){
  const done=()=>toast("コピーしました");
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done, ()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement("textarea");
    ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast("コピーできませんでした"); }
    document.body.removeChild(ta);
  }
}

/* ------------------------- Googleカレンダー連携 ------------------------- */
function tzOffsetMin(date, tz){
  const dtf=new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const p={}; dtf.formatToParts(date).forEach(x=>p[x.type]=x.value);
  const asUTC=Date.UTC(+p.year, p.month-1, +p.day, p.hour==="24"?0:+p.hour, +p.minute, +p.second);
  return (asUTC - date.getTime())/60000;
}
function zonedToUTC(dateStr, min, tz){
  const [y,mo,d]=dateStr.split("-").map(Number);
  const h=Math.floor(min/60), mi=min%60;
  const guess=Date.UTC(y,mo-1,d,h,mi);
  let off=tzOffsetMin(new Date(guess),tz);
  let ts=guess-off*60000;
  off=tzOffsetMin(new Date(ts),tz);
  return new Date(guess-off*60000);
}
const z=(n)=>String(n).padStart(2,"0");
function utcStamp(dt){
  return dt.getUTCFullYear()+z(dt.getUTCMonth()+1)+z(dt.getUTCDate())+"T"+z(dt.getUTCHours())+z(dt.getUTCMinutes())+"00Z";
}
function localStamp(dateStr,min){
  const off=Math.floor(min/1440);
  const d=addDays(dateStr,off).replace(/-/g,"");
  const h=Math.floor(min/60)%24, mi=min%60;
  return d+"T"+z(h)+z(mi)+"00";
}
function gcalUrl(e){
  const tz=tzOf(e.date);
  const details=[e.memo, e.hours?("営業時間: "+e.hours):"", e.rating?("おすすめ度: "+"★".repeat(e.rating)):"", e.url, e.mapUrl]
    .filter(Boolean).join("\n");
  const p=new URLSearchParams({
    action:"TEMPLATE",
    text:(e.title||"予定"),
    dates: localStamp(e.date,e.start)+"/"+localStamp(e.date,e.end),
    ctz: tz,
    details: details,
    location: e.place||""
  });
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
/* 1日分をまとめてカレンダーへ（.ics を共有 or ダウンロード） */
async function addDayToCalendar(d){
  const list = eventsOfDay(d);
  if(!list.length){ toast("この日の予定がありません"); return; }
  const name = (state.meta.name||"trip").replace(/[\\/:*?"<>|]/g,"_") + "_" + d;
  const file = new File([buildICS(list)], name+".ics", {type:"text/calendar"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:dayLabel(d)+"("+wdLabel(d)+")の予定"});
      return;                       // 共有シートから「カレンダーに追加」を選べる
    }catch(err){ if(err && err.name==="AbortError") return; }
  }
  downloadICS(list, name);
}
async function addAllToCalendar(){
  const list = Object.values(state.events).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start);
  if(!list.length){ toast("予定がありません"); return; }
  const name = (state.meta.name||"trip").replace(/[\\/:*?"<>|]/g,"_");
  const file = new File([buildICS(list)], name+".ics", {type:"text/calendar"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:(state.meta.name||"旅行")+" 全日程"}); return; }
    catch(err){ if(err && err.name==="AbortError") return; }
  }
  downloadICS(list, name);
}

function icsEscape(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
function buildICS(events){
  const now=utcStamp(new Date());
  let s="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//TripPlanner//JP\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\n";
  s+="X-WR-CALNAME:"+icsEscape(state.meta.name||"旅行")+"\r\n";
  events.forEach(e=>{
    const c=catOf(e.cat);
    const tz=tzOf(e.date);
    const desc=[e.memo, e.hours?("営業時間: "+e.hours):"", e.rating?("おすすめ度: "+"★".repeat(e.rating)):"",
                "カテゴリ: "+c.label, e.url, e.mapUrl].filter(Boolean).join("\n");
    s+="BEGIN:VEVENT\r\n";
    s+="UID:"+e.id+"@tripplanner\r\n";
    s+="DTSTAMP:"+now+"\r\n";
    s+="DTSTART:"+utcStamp(zonedToUTC(e.date,e.start,tz))+"\r\n";
    s+="DTEND:"+utcStamp(zonedToUTC(e.date,e.end,tz))+"\r\n";
    s+="SUMMARY:"+icsEscape(e.title)+"\r\n";
    if(e.place) s+="LOCATION:"+icsEscape(e.place)+"\r\n";
    s+="DESCRIPTION:"+icsEscape(desc)+"\r\n";
    s+="END:VEVENT\r\n";
  });
  return s+"END:VCALENDAR\r\n";
}
function downloadICS(events, name){
  const blob=new Blob([buildICS(events)],{type:"text/calendar;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name+".ics";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast("ics を書き出しました");
}

/* ------------------------- 検索 ------------------------- */
function openSearch(){
  $("#searchBody").innerHTML =
    '<h2>検索</h2>'+
    '<div class="field"><input id="sQ" placeholder="店名・場所・メモで検索" autocomplete="off"></div>'+
    '<div id="sRes"></div>';
  const run=()=>{
    const q=$("#sQ").value.trim().toLowerCase();
    const box=$("#sRes");
    if(!q){ box.innerHTML='<div class="empty">キーワードを入力すると、全日程から探します</div>'; return; }
    const hit=Object.values(state.events).filter(e=>
      [e.title,e.place,e.memo,e.hours,catOf(e.cat).label].join(" ").toLowerCase().indexOf(q)>=0
    ).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start).slice(0,60);
    if(!hit.length){ box.innerHTML='<div class="empty">見つかりませんでした</div>'; return; }
    box.innerHTML = hit.map(e=>{
      const c=catOf(e.cat);
      return '<button class="sresult" data-id="'+e.id+'"><span class="sd">'+dayLabel(e.date)+'<br>'+fmtTime(e.start)+'</span>'+
        '<span class="sb"><b>'+esc(e.title)+'</b><span>'+esc(e.place||c.label)+'</span></span>'+
        '<span class="sc" style="background:'+c.color+'"></span></button>';
    }).join("");
    box.querySelectorAll(".sresult").forEach(b=>b.onclick=()=>{
      const e=state.events[b.dataset.id]; if(!e) return;
      const i=tripDays().indexOf(e.date); if(i>=0) dayIndex=i;
      closeSheets(); render();
      setTimeout(()=>{
        $("#scroller").scrollTop=Math.max(0,(e.start-GS)*PX_PER_MIN-140);
        openDetail(e);
      },220);
    });
  };
  $("#sQ").oninput=run; run();
  openSheet("#sheetSearch");
  setTimeout(()=>{ try{ $("#sQ").focus(); }catch(err){} },420);
}

    '<h2 style="margin-top:18px">旅行の設定</h2>'+
    '<div class="field"><label>旅行名</label><input id="mName" value="'+esc(state.meta.name)+'"></div>'+

    '<div class="row2"><div class="field"><label>開始日</label><input type="date" id="mStart" value="'+state.meta.start+'"></div>'+
    '<div class="field"><label>終了日</label><input type="date" id="mEnd" value="'+state.meta.end+'"></div></div>'+
    '<div class="btns"><button class="btn pri" id="mSave">設定を保存</button></div>'+

    '<h2 style="margin-top:18px">都市・タイムゾーン</h2>'+
    '<div class="hint">滞在都市ごとに開始日とタイムゾーンを設定します。カレンダー書き出しの時刻はこの設定で変換されるので、時差のある複数都市でも正しい時間で登録されます。</div>'+
    '<div id="mSegs"></div>'+
    '<div class="btns"><button class="btn sm" id="mAddSeg">＋ 都市を追加</button></div>'+

    '<h2 style="margin-top:18px">カテゴリ</h2><div id="mCats"></div>'+
    '<div class="btns"><button class="btn sm" id="mAddCat">＋ カテゴリを追加</button></div>'+

    '<h2 style="margin-top:18px">共有</h2>'+
    '<div class="field"><label>共有ルームID（同じIDなら同じ旅程を見られます）</label><input id="mRoom" value="'+esc(ROOM_ID)+'"></div>'+
    '<div class="btns"><button class="btn sm" id="mRoomGo">ルームを切替</button><button class="btn sm" id="mShare">共有URLをコピー</button></div>'+
    '<div class="hint">同期状態：'+esc(syncText)+'／'+(FIREBASE_CONFIG.databaseURL? "Firebase 設定済み（リアルタイム同期）":"未設定 → この端末のみ保存（localStorage）。ファイル冒頭の FIREBASE_CONFIG を埋めると家族と同期されます。")+'</div>'+

    '<h2 style="margin-top:18px">ゴミ箱（'+trash.length+'）</h2>'+
    (trash.length? trash.map(e=>'<div class="trashitem"><div class="ti"><b>'+esc(e.title)+'</b><span>'+dayLabel(e.date)+" "+fmtTime(e.start)+'–'+fmtTime(e.end)+'</span></div><button class="btn sm" style="flex:0 0 auto;padding:8px 14px" data-restore="'+e.id+'">復元</button></div>').join("")
      : '<div class="hint">削除した予定はここに入ります。</div>')+

    '<h2 style="margin-top:18px">データ</h2>'+
    '<div class="btns"><button class="btn sm" id="mExport">JSON書き出し</button><button class="btn sm" id="mImport">JSON読み込み</button></div>'+
    '<div class="btns"><button class="btn sm dan" id="mReset">サンプルに戻す</button></div>'+
    '<div style="height:10px"></div>';

  $("#mTheme").querySelectorAll("button").forEach(b=>{

  });

  $("#mCopyAll").onclick=()=>copyText(tripDays().map(dayText).join("\n\n──────────\n\n"));
  $("#mIcsDay").onclick=()=>addDayToCalendar(d);
  $("#mIcsAll").onclick=()=>addAllToCalendar();
  $("#mSave").onclick=()=>{
    state.meta.name=$("#mName").value.trim()||"旅行";
    state.meta.note=$("#mNote").value.trim();
    state.meta.start=$("#mStart").value; state.meta.end=$("#mEnd").value;
    if(parseDate(state.meta.end)<parseDate(state.meta.start)) state.meta.end=state.meta.start;
    dayIndex=0; closeSheets(); commit(); toast("保存しました");
  };
  /* 都市・タイムゾーン */
  const TZS=["Asia/Tokyo","America/New_York","America/Chicago","America/Denver","America/Los_Angeles","America/Mexico_City","America/Cancun","America/Sao_Paulo","Europe/London","Europe/Paris","Europe/Madrid","Asia/Seoul","Asia/Taipei","Asia/Shanghai","Asia/Bangkok","Asia/Singapore","Asia/Dubai","Australia/Sydney","Pacific/Honolulu"];
  const sw=$("#mSegs");
  segments().forEach((sg,i)=>{
    const row=document.createElement("div");
    row.className="catedit"; row.style.flexWrap="wrap";
    row.innerHTML=
      '<input type="date" value="'+sg.from+'" style="flex:0 0 130px;background:#fff;border:1px solid var(--line2);border-radius:8px;padding:7px">'+

      '<select style="flex:1 1 100%;background:#fff;border:1px solid var(--line2);border-radius:8px;padding:7px;margin-top:4px">'+

/* ------------------------- PWA ------------------------- */
function setupPWA(){
  const cv=document.createElement("canvas"); cv.width=cv.height=512;
  const x=cv.getContext("2d");
  const g=x.createLinearGradient(0,0,512,512); g.addColorStop(0,"#2563EB"); g.addColorStop(1,"#7C4DDB");
  x.fillStyle=g; x.fillRect(0,0,512,512);
  x.fillStyle="#ffffff"; x.font="bold 300px -apple-system,sans-serif";
  x.textAlign="center"; x.textBaseline="middle"; x.fillText("旅",256,276);
  const icon=cv.toDataURL("image/png");
  const link=document.createElement("link"); link.rel="apple-touch-icon"; link.href=icon; document.head.appendChild(link);
  const manifest={
    name:(state&&state.meta.name)||"旅程プランナー", short_name:"旅程",
    start_url:location.pathname+location.search+location.hash,
    scope:"./", display:"standalone", orientation:"portrait",
    background_color:isDark()?"#121110":"#FBFAF8", theme_color:isDark()?"#121110":"#FBFAF8",
    icons:[{src:icon,sizes:"512x512",type:"image/png",purpose:"any maskable"}]
  };
  const m=document.createElement("link"); m.rel="manifest";
  m.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"}));
  document.head.appendChild(m);
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js").catch(()=>{});  // sw.js があればオフライン対応（無くてもOK）
  }
}

/* ------------------------- 起動 ------------------------- */
function boot(){
  applyTheme();
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){}
  state = saved ? normalize(saved) : seedData();
  const ds=tripDays();
  const today=toKey(new Date());
  const i=ds.indexOf(today); dayIndex = i>=0?i:0;
  render();
  setupPWA();
  initFirebase();
  // その日の最初の予定（無ければ8:00）が見えるようにスクロール
  setTimeout(()=>{ scrollToStart(); },60);
  setInterval(placeNowLine, 60000);
}
function scrollToStart(){
  const evs=eventsOfDay(tripDays()[dayIndex]);
  const m = evs.length ? evs[0].start-30 : 8*60;
  $("#scroller").scrollTop = Math.max(0,(m-GS)*PX_PER_MIN-16);
}
$("#btnMenu").onclick=openMenu;
$("#btnSearch").onclick=openSearch;
$("#btnTheme").onclick=()=>setTheme(isDark()?"light":"dark");
$("#fab").onclick=()=>openEditor(null, 600);
window.addEventListener("hashchange",()=>location.reload());
boot();
</script>
